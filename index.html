<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yufan Shen 的个人小站。记录学习、尝试，以及生活里的小事。">
    <meta name="theme-color" content="#f7f6f0">
    <title>Yufan Shen · 个人小站</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #f7f6f0;
            --ink: #303e3a;
            --muted: #6b756f;
            --sea: #506b60;
            --profile-width: 35%;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.8;
        }

        a { color: inherit; text-underline-offset: 5px; }
        a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
        ::selection { background: #dce4d8; color: #233d32; }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 8px 16px;
            background: var(--paper);
            transform: translateY(-160%);
        }

        .skip-link:focus { transform: translateY(0); }

        .profile {
            position: fixed;
            inset: 0 auto 0 0;
            width: var(--profile-width);
            overflow-y: auto;
            background: #4f615a;
            color: #fffef7;
            isolation: isolate;
        }

        .profile-background {
            position: absolute;
            inset: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 70% center;
        }

        .profile::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgb(18 37 32 / 62%), rgb(18 37 32 / 35%) 44%, rgb(18 37 32 / 4%) 74%, rgb(18 37 32 / 28%));
        }

        .profile-inner {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            padding: clamp(48px, 9vh, 100px) clamp(28px, 4vw, 72px) 32px;
        }

        .avatar {
            display: block;
            width: 88px;
            height: 88px;
            margin-bottom: 24px;
            border: 3px solid rgb(255 254 247 / 65%);
            border-radius: 50%;
            object-fit: cover;
            object-position: center 10%;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(32px, 3vw, 46px);
            font-weight: 400;
            letter-spacing: -1.2px;
            line-height: 1.2;
        }

        .handle {
            width: fit-content;
            margin-top: 8px;
            font-size: 14px;
            letter-spacing: .04em;
            text-decoration: none;
            color: #e2e7de;
        }

        .profile-description { margin: 26px 0 22px; font-size: 14px; letter-spacing: .08em; }
        .contact-links { display: flex; flex-direction: column; gap: 11px; }
        .contact-links a { display: flex; align-items: center; gap: 10px; width: fit-content; font-size: 13px; text-decoration: none; }
        .contact-links span { overflow-wrap: anywhere; }
        .contact-links svg { flex: none; width: 16px; height: 16px; }
        .contact-links a:hover span, .handle:hover { text-decoration: underline; }

        .photo-caption {
            margin: auto 0 0;
            padding-top: 170px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 14px;
            font-style: italic;
            letter-spacing: .06em;
            text-shadow: 0 1px 8px rgb(0 0 0 / 35%);
        }

        main {
            display: flex;
            flex-direction: column;
            min-height: 100svh;
            margin-left: var(--profile-width);
            padding: 50px clamp(38px, 6.3vw, 110px) 28px;
        }

        .introduction { padding-top: clamp(64px, 10vh, 116px); }
        .section-label { margin: 0 0 18px; color: var(--sea); font-size: 11px; letter-spacing: .12em; }

        h2 {
            margin: 0 0 28px;
            font-family: "Songti SC", "STSong", "SimSun", serif;
            font-size: clamp(30px, 3vw, 45px);
            font-weight: 400;
            letter-spacing: .04em;
            line-height: 1.65;
        }

        footer { margin-top: auto; padding-top: 24px; color: var(--muted); font-size: 10px; letter-spacing: .04em; }

        .introduction { animation: appear 700ms ease-out both; }
        @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (min-width: 761px) and (max-width: 1050px) {
            :root { --profile-width: 38%; }
            .profile-inner { padding-left: 28px; padding-right: 28px; }
            main { padding-left: 38px; padding-right: 38px; }
        }

        @media (max-width: 760px) {
            .profile { position: relative; width: 100%; overflow: visible; }
            .profile-inner { min-height: 620px; padding: 48px 32px 28px; }
            .profile-background { object-position: right 60%; }
            .avatar { width: 76px; height: 76px; margin-bottom: 20px; }
            h1 { font-size: 38px; }
            .profile-description { margin-top: 20px; }
            .photo-caption { padding-top: 180px; }
            main { min-height: auto; margin-left: 0; padding: 36px 28px 24px; }
            .introduction { padding-top: 52px; }
            h2 { font-size: clamp(27px, 6vw, 38px); margin-bottom: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .introduction { animation: none; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">跳到正文</a>

        <img class="profile-background" src="images/sailing.jpg" alt="" width="675" height="1200" fetchpriority="high">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4 1-4-2-6-2m12 5v-3.5c0-1 .1-1.5-.5-2 3-.3 6-1.5 6-6.5A5 5 0 0 0 19 6.5 5 5 0 0 0 19 3s-1 0-3 1.5a13 13 0 0 0-8 0C6 3 5 3 5 3a5 5 0 0 0 0 3.5A5 5 0 0 0 3.5 10c0 5 3 6.2 6 6.5-.6.5-.6 1.4-.5 2V22"/></svg>

    <main id="main-content" tabindex="-1">

            <h2 id="welcome-title">你好，<br>欢迎来到我的page</h2>
        </section>

        <footer>
            <span>© 2026 Yufan Shen</span>
        </footer>
    </main>
</body>
</html>
